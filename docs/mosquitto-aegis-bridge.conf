# Aegis-Grid: connect Faras's local Mosquitto (Wokwi + Unity) to the shared public broker.
#
# ADD this block to the END of the mosquitto.conf Faras already uses. Do not change his existing
# listener lines: Wokwi and Unity keep talking to the local broker exactly as before.
# Then restart Mosquitto. Wokwi, Unity and their topics stay unchanged.
#
# What it forwards (see docs/integration-v2.md):
#   out: demo/telemetry           METER_A -> public broker   (backend + dashboard read it)
#   out: meter/+/final            METER_A/METER_B final events (Stage 5B.2) -> backend evidence store
#   out: meter/METER_B/telemetry  METER_B firmware telemetry (backend only notes that METER_B is alive)
#   in : demo/control/#           public broker -> Wokwi (REMOTE mode, outage and other controls)
#   in : trade/cmd                public broker -> METER_A (START/STOP with the escrow trade id)
# Each topic crosses in one direction only, so there are no message loops, and Unity's own local
# controls stay local. The backend never publishes meter/+/final, so nothing comes back on those topics.

connection aegis-hivemq
address broker.hivemq.com:1883
# must be unique on the public broker: change the last part if two laptops run this bridge
remote_clientid aegis-ag-sakarya26-bridge-faras
cleansession true
try_private false
bridge_protocol_version mqttv311
notifications false
start_type automatic
restart_timeout 5 30
keepalive_interval 30

topic aegis-grid/ag-sakarya26/demo/telemetry out 0
topic aegis-grid/ag-sakarya26/meter/+/final out 1
topic aegis-grid/ag-sakarya26/meter/METER_B/telemetry out 0
topic aegis-grid/ag-sakarya26/demo/control/# in 1
topic aegis-grid/ag-sakarya26/trade/cmd in 1
