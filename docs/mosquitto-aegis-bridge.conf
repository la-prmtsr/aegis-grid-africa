# Aegis-Grid: connect Faras's local Mosquitto (Wokwi + Unity) to the shared public broker.
#
# ADD this block to the END of the mosquitto.conf Faras already uses. Do not change his existing
# listener lines: Wokwi and Unity keep talking to the local broker exactly as before.
# Then restart Mosquitto. Wokwi, Unity and their topics stay unchanged.
#
# What it forwards (tested with Mosquitto 2.0.18, see docs/integration-v2.md):
#   out: demo/telemetry   Wokwi -> public broker   (backend + dashboard read it)
#   in : demo/control/#   public broker -> Wokwi   (backend sends Buyer Request / outage commands)
# Nothing else crosses, so there are no message loops and Unity's own local controls stay local.

connection aegis-hivemq
address broker.hivemq.com:1883
# must be unique on the public broker: change the last part if two laptops run this bridge
remote_clientid aegis-ag-sakarya26-bridge-faras
cleansession true
try_private false
bridge_protocol_version mqttv311
notifications false
start_type automatic
restart_timeout 5 30
keepalive_interval 30

topic aegis-grid/ag-sakarya26/demo/telemetry out 0
topic aegis-grid/ag-sakarya26/demo/control/# in 1
